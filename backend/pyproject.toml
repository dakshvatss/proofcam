[project]
name = "proofcam"
version = "0.0.1"
description = "ProofCam: camera-guided active visual inspection agent (Meta Model API)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pillow>=10",
  "python-dotenv>=1.0",
  "meta-sam-parser>=0.1.0",
  "numpy>=1.26",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proofcam = "proofcam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proofcam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: calls the real Meta Model API (requires MODEL_API_KEY; costs money)"]
addopts = "-m 'not live'"
